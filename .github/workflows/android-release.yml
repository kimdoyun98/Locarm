name: Android Release Build

on:
  push:
    branches:
      - main   # main에 push 또는 머지되었을 때 실행
  workflow_dispatch:

# 동시 실행 시 versionCode가 겹치는 것을 방지
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    environment:
       name: production

    permissions:
      contents: write   # 버전 커밋 백 & 태그 생성에 필요

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 이전 커밋의 versionName 비교에 필요

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🔢 버전 자동 증가 (versionCode +1, versionName patch +1)
      - name: Bump version
        id: bump
        run: |
          set -euo pipefail
          GRADLE_FILE=app/build.gradle

          CURRENT_CODE=$(sed -n 's/.*versionCode  *\([0-9][0-9]*\).*/\1/p' "$GRADLE_FILE" | head -1)
          CURRENT_NAME=$(sed -n 's/.*versionName  *"\([^"]*\)".*/\1/p' "$GRADLE_FILE" | head -1)
          PREV_NAME=$(git show HEAD~1:"$GRADLE_FILE" 2>/dev/null \
            | sed -n 's/.*versionName  *"\([^"]*\)".*/\1/p' | head -1 || true)

          # 파싱 실패 시 잘못된 버전으로 덮어쓰지 않도록 즉시 중단
          case "$CURRENT_NAME" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::versionName 파싱 실패: '$CURRENT_NAME'"; exit 1 ;;
          esac
          if [ -z "$CURRENT_CODE" ]; then
            echo "::error::versionCode 파싱 실패"; exit 1
          fi

          NEW_CODE=$((CURRENT_CODE + 1))

          if [ -n "$PREV_NAME" ] && [ "$CURRENT_NAME" != "$PREV_NAME" ]; then
            # 이번 커밋에서 versionName을 직접 수정한 경우 그 값을 그대로 사용 (major/minor 릴리스)
            NEW_NAME="$CURRENT_NAME"
            echo "versionName이 수동으로 변경됨: $PREV_NAME -> $NEW_NAME (patch 자동 증가 생략)"
          else
            MAJOR=$(echo "$CURRENT_NAME" | cut -d. -f1)
            MINOR=$(echo "$CURRENT_NAME" | cut -d. -f2)
            PATCH=$(echo "$CURRENT_NAME" | cut -d. -f3)
            NEW_NAME="$MAJOR.$MINOR.$((PATCH + 1))"
          fi

          sed -i "s/versionCode  *[0-9][0-9]*/versionCode $NEW_CODE/" "$GRADLE_FILE"
          sed -i "s/versionName  *\"[^\"]*\"/versionName \"$NEW_NAME\"/" "$GRADLE_FILE"

          echo "new_code=$NEW_CODE" >> "$GITHUB_OUTPUT"
          echo "new_name=$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "versionCode $CURRENT_CODE -> $NEW_CODE / versionName $CURRENT_NAME -> $NEW_NAME"

      - name: Grant execute permission
        run: chmod +x gradlew

      # 🔐 Keystore 복원
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keystore.jks

      # 🔐 local.properties 생성 (서명 정보)
      - name: Create local.properties
        run: |
          echo "storeFile=keystore.jks" >> local.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> local.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties
          echo "address_key=${{ secrets.KEY_ADDRESS }}" >> local.properties
          echo "Client_ID=${{ secrets.Client_ID }}" >> local.properties
          echo "Client_Secret=${{ secrets.Client_Secret }}" >> local.properties
          echo "ADS_INTERSTITIAL_ID=${{ secrets.ADS_INTERSTITIAL_ID }}" >> local.properties
          echo "ADS_APP_ID=${{ secrets.ADS_APP_ID }}" >> local.properties

      # CD
      - name: Build AAB
        run: ./gradlew bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: app/build/outputs/bundle/release/app-release.aab

      # 📌 버전 커밋 백 & 태그 생성 (빌드 성공 후)
      - name: Commit version bump and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "[Build] release ${{ steps.bump.outputs.new_name }} [skip ci]"
          git tag "v${{ steps.bump.outputs.new_name }}"
          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.new_name }}"

      # 🔽 bundletool 다운로드
      - name: Download bundletool
        run: |
          wget https://github.com/google/bundletool/releases/download/1.15.6/bundletool-all-1.15.6.jar -O bundletool.jar

      # 🔽 AAB → APK 변환
      - name: Convert AAB to APK
        run: |
          java -jar bundletool.jar build-apks \
            --bundle=app/build/outputs/bundle/release/app-release.aab \
            --output=app.apks \
            --mode=universal \
            --ks=app/keystore.jks \
            --ks-key-alias=${{ secrets.KEY_ALIAS }} \
            --ks-pass=pass:${{ secrets.STORE_PASSWORD }} \
            --key-pass=pass:${{ secrets.KEY_PASSWORD }}

      # 🔽 APK 추출
      - name: Extract APK
        run: unzip app.apks -d apks

      # 🔽 APK 업로드
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: apks/universal.apk

      # 🔽 Play Store 배포
      - name: Deploy to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.kimdoyun.locarm
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
